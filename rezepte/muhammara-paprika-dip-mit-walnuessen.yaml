notes: >
  Das Gemüse muss bei starker Hitze geröstet werden, damit die Röstaromen
  entstehen. Je dunkler die Paprikahaut, desto leichter lässt sie sich
  abziehen. Auch Tomaten oder ganze Chilischoten lassen sich mitrösten.
  Walnüsse können roh oder geröstet verwendet werden, Ersatz sind geröstete
  Mandeln, Cashews oder Sonnenblumenkerne. Ersatz für Granatapfelsirup:
  Zitronensaft mit etwas Honig oder Ahornsirup mischen oder ein Schuss
  milder Balsamico. Ist der Dip zu flüssig, die Paprika gut abtropfen lassen
  und Walnüsse nach und nach ergänzen. Der Dip lässt sich am Vortag
  zubereiten; Granatapfelkerne und Toppings erst kurz vor dem Servieren
  daraufgeben.
